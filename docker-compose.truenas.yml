services:
  ytm-desktop-webapp:
    image: ghcr.io/xchrizl/ytm-desktop-webapp:latest
    pull_policy: always
    networks:
      - traefik-net
    environment:
      # --- YTM Desktop companion server ---
      REMOTE_IP: "192.168.20.36"
      REMOTE_PORT: "9863"
      API_VERSION: "v1"
      # --- App identity ---
      APP_ID: "ytm-desktop-webapp"
      APP_NAME: "YTM-Desktop WebApp"
      APP_VERSION: "1.0.0"
      # --- This app's own web server ---
      SERVER_PORT: "8080"
      # Persist the pairing token and runtime settings (the companion host set
      # from the UI) on a named volume so they survive container recreation.
      TOKEN_FILE_PATH: "/data/token.txt"
      SETTINGS_FILE_PATH: "/data/settings.json"
    volumes:
      - token-data:/data
    restart: unless-stopped

volumes:
  token-data:

networks:
  traefik-net:
    external: true
