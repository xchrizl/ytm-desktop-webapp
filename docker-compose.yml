services:
  ytm-desktop-webapp:
    # Built and pushed manually — see README for the build/push commands.
    # TrueNAS's Compose support runs images, it doesn't build Dockerfiles.
    image: ghcr.io/xchrizl/ytm-desktop-webapp:latest
    pull_policy: always
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    env_file:
      - .env
    environment:
      # Persist the pairing token and runtime settings (the companion host set
      # from the UI) on a named volume so they survive container recreation.
      TOKEN_FILE_PATH: /data/token.txt
      SETTINGS_FILE_PATH: /data/settings.json
    volumes:
      - token-data:/data
    restart: unless-stopped

volumes:
  token-data:
